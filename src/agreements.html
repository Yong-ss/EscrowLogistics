<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agreements · Escrow Logistics</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-page="agreements" data-title="Agreements">
    <div data-include="partials/sidebar.html"></div>
    <main class="app-shell">
      <div data-include="partials/header.html"></div>
      <div class="page-content">
        <p class="form-help">
          Look up any agreement and reconstruct its transaction history from
          contract events.
        </p>
        <section class="form-card">
          <h2>Agreement details</h2>
          <div class="form-grid">
            <div class="field">
              <label for="viewId">Agreement ID</label>
              <input id="viewId" type="number" min="1" value="1" />
            </div>
          </div>
          <div class="form-actions">
            <button class="button button-dark" onclick="loadAgreementDetails()">
              Load details →
            </button>
          </div>
          <div id="agreementDetails"></div>
        </section>
        <section class="table-card" style="margin-top: 18px">
          <h2>Transaction history</h2>
          <button class="button button-dark" onclick="loadAgreementHistory()">
            Refresh history
          </button>
          <table class="data-table" id="historyTable">
            <thead>
              <tr>
                <th>Event</th>
                <th>Details</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
        <div id="status" class="status-message"></div>
      </div>
      <div data-include="partials/footer.html"></div>
    </main>
    <script src="js/controllers/agreementController.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.2.7-rc.0/web3.min.js"></script>
    <script src="js/abi.js"></script>
    <script src="js/utils/formatUtils.js"></script>
    <script src="js/utils/domUtils.js"></script>
    <script src="js/services/walletConnection.js"></script>
    <script src="js/services/contractConnection.js"></script>
    <script src="js/controllers/pageController.js"></script>
    <script src="js/siteShell.js"></script>
  </body>
</html>
