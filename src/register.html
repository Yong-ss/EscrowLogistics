<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Account & Role · Escrow Logistics</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-page="register" data-title="Account & Role">
    <div data-include="partials/sidebar.html"></div>
    <main class="app-shell">
      <div data-include="partials/header.html"></div>
      <div class="page-content">
        <p class="form-help">
          Connect your wallet, then choose the role that matches your side of
          the delivery.
        </p>
        <section class="form-card">
          <h2 id="account">Wallet not connected</h2>
          <p class="form-help">
            One wallet can register once. Your role is stored on-chain.
          </p>
          <div class="action-grid" data-role="none">
            <button class="button button-dark" onclick="registerAsRole(1)">
              Register as Shipper
            </button>
            <button class="button button-dark" onclick="registerAsRole(2)">
              Register as Carrier
            </button>
          </div>
        </section>
        <div id="status" class="status-message"></div>
      </div>
      <div data-include="partials/footer.html"></div>
    </main>
    <script src="js/controllers/registerController.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.2.7-rc.0/web3.min.js"></script>
    <script src="js/abi.js"></script>
    <script src="js/utils/formatUtils.js"></script>
    <script src="js/utils/domUtils.js"></script>
    <script src="js/services/walletConnection.js"></script>
    <script src="js/services/contractConnection.js"></script>
    <script src="js/controllers/pageController.js"></script>
    <script src="js/siteShell.js"></script>
  </body>
</html>
