<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Jobs · Escrow Logistics</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-page="jobs" data-title="My Jobs">
    <div data-include="partials/sidebar.html"></div>
    <main class="app-shell">
      <div data-include="partials/header.html"></div>
      <div class="page-content">
        <p class="form-help">
          Track agreements assigned to your wallet, released earnings, and
          reputation.
        </p>
        <section class="table-card" data-role="carrier">
          <h2>Carrier dashboard</h2>
          <p>
            Reputation points:
            <strong id="repPoints">0</strong>
          </p>
          <button class="button button-dark" onclick="loadCarrierJobs()">
            Refresh jobs
          </button>
          <table class="data-table" id="jobsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Shipper</th>
                <th>Total ETH</th>
                <th>Milestones</th>
                <th>Received ETH</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
        <div id="status" class="status-message"></div>
      </div>
      <div data-include="partials/footer.html"></div>
    </main>
    <script src="js/controllers/carrierController.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.2.7-rc.0/web3.min.js"></script>
    <script src="js/abi.js"></script>
    <script src="js/utils/formatUtils.js"></script>
    <script src="js/utils/domUtils.js"></script>
    <script src="js/services/walletConnection.js"></script>
    <script src="js/services/contractConnection.js"></script>
    <script src="js/controllers/pageController.js"></script>
    <script src="js/siteShell.js"></script>
  </body>
</html>
